    <style>
        #iso-rect {
            transform-origin: center;
            transform-box: fill-box;
            transform: skew(-60deg, 30deg) scale(0.87, 0.5) rotate(30deg);
            animation: rotateSkewAnim 800ms ease-out forwards;
        }

        @keyframes rotateSkewAnim {
            100% { transform: skew(-60deg, 30deg) scale(0.87, 0.5) rotate(0deg); }
        }

        .arrowInfra {
            clip-path: polygon(0 0, 100% 0, 100% 8%, 0 8%);
            animation: growArrow 600ms ease-out forwards;
        }

        #arrow-2 {
            clip-path: polygon(0 92%, 100% 92%, 100% 100%, 0 100%);
        }

        @keyframes growArrow {
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); }
        }

        .arrowHeadInfra {
            transform-origin: center;
            transform-box: fill-box;
            transform: translateY(-275px);
            animation: growArrowHead 600ms ease-out forwards;
        }

        #arrow-head-2 {
            transform: translateY(275px);
        }

        @keyframes growArrowHead {
            100% { transform: translateY(0); }
        }
    </style>
