<svg width="489" height="471" viewBox="0 0 489 471" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        #lean-branding-02 {
            --brSpeed: 400ms;
            --brDelay: 200ms;
        }
        .br-lines {
            clip-path: polygon(0 0, 0 0, 0 100%, 0% 100%);
            animation: brLineAnim var(--brSpeed) ease-out both;
        }

        @keyframes brLineAnim {
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); }
        }

        #lineLean-6 {
            animation-delay: var(--brDelay);
        }

        #lineLean-5 {
            animation-delay: calc(var(--brDelay) * 2);
        }

        #lineLean-4 {
            animation-delay: calc(var(--brDelay) * 3);
        }

        #lineLean-3 {
            animation-delay: calc(var(--brDelay) * 4);
        }

        #lineLean-2 {
            animation-delay: calc(var(--brDelay) * 5);
        }

        #lineLean-1 {
            animation-delay: calc(var(--brDelay) * 6);
        }
    </style>
