<svg width="510" height="510" viewBox="0 0 510 510" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .brGroup path, .brGroup circle {
            stroke-dasharray: 350;
            stroke-dashoffset: 350;
            transform: rotate(-100deg);
            transform-box: fill-box;
            transform-origin: center;
            animation: rollDrawAnim 1000ms ease-in-out forwards;
        }

        @keyframes rollDrawAnim {
            100% { stroke-dashoffset: 0; transform: rotate(0deg); }
        }

        .brGroup > *:nth-child(1) {
            stroke-dasharray: 487; stroke-dashoffset: 487;
        }
        .brGroup > *:nth-child(2) {
            stroke-dasharray: 558; stroke-dashoffset: 558;
            animation-delay: 100ms;
        }
        .brGroup > *:nth-child(3) {
            stroke-dasharray: 253; stroke-dashoffset: 253;
            animation-delay: 200ms;
        }
        .brGroup > *:nth-child(4) {
            stroke-dasharray: 310; stroke-dashoffset: 310;
            animation-delay: 30ms;
        }
        .brGroup > *:nth-child(5) {
            stroke-dasharray: 718; stroke-dashoffset: 718;
            animation-delay: 400ms;
        }
        .brGroup > *:nth-child(6) {
            stroke-dasharray: 874; stroke-dashoffset: 874;
            animation-delay: 500ms;
        }
    </style>
    <g class="brGroupCircle">
        <circle cx="255" cy="255" r="254" stroke="#181818" stroke-width="2" stroke-dasharray="8 8"/>
    </g>
    <g class="brGroup">
